name: Validate StreamCore
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shell, JavaScript and Compose
        run: |
          sh -n publisher/start-stream.sh
          bash -n install.sh
          bash -n scripts/update-release.sh
          bash -n scripts/install-updater.sh
          python3 -m py_compile scripts/release-check.py
          bash tests/test_installer.sh
          node --test telegram-serverless/tests/*.test.js
          node --check telegram-serverless/tgcloud/handlers/message.js
          node --check telegram-serverless/tgcloud/handlers/callback_query.js
          node --check telegram-serverless/public/app.js
          node --check dashboard/static/app.js
          node --check dashboard/static/scene-editor.js
          node --test tests/test_scene_editor.cjs tests/test_scene_transform.cjs
          node --test tests/test_telemetry_ui.cjs tests/test_player_recovery.cjs
          python -m compileall -q dashboard
          cp .env.example .env
          docker compose --profile legacy-demo --profile legacy-file config --quiet
      - name: Verify actual browser resize handles (desktop and touch-width)
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          node --test tests/test_scene_handle_browser.cjs
      - name: Install fonts for RTL text rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core ffmpeg
      - name: Install test dependencies
        run: pip install -r dashboard/requirements.txt httpx pytest
      - name: Validate dashboard endpoints
        run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Real mouse, touch, pen and FFmpeg browser interactions
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Build dashboard container
        run: docker compose build dashboard
